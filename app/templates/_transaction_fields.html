{% set allow_uncategorized = tx is defined and tx.category_id is none and tx.transaction_type != 'transfer' %}
<label>Type<select name="transaction_type" id="txType">{% for kind in ['expense', 'income', 'transfer'] %}<option value="{{ kind }}" {{ 'selected' if values.get('transaction_type') == kind }}>{{ kind|title }}</option>{% endfor %}</select></label>
<label>Amount<input name="amount" inputmode="decimal" value="{{ values.get('amount', '') }}" placeholder="45000" required></label>
<label>Paid from / charged to<select name="account_id" required>{% for a in active_accounts %}<option value="{{ a.id }}" {{ 'selected' if values.get('account_id') == a.id|string }}>{{ a.name }}{{ ' · Credit card' if a.account_type == 'credit' else '' }}{{ ' (archived)' if not a.is_active else '' }}</option>{% endfor %}</select></label>
<label id="categoryField">Category<select name="category_id" id="categorySelect" data-uncategorized-kind="{{ tx.transaction_type if allow_uncategorized else '' }}">{% if allow_uncategorized %}<option value="" data-kind="{{ tx.transaction_type }}" {{ 'selected' if not values.get('category_id') }}>No category (keep existing)</option>{% endif %}{% for c in categories %}<option value="{{ c.id }}" data-kind="{{ c.kind }}" {{ 'selected' if values.get('category_id') == c.id|string }}>{{ c.icon }} {{ c.name }}</option>{% endfor %}</select></label>
<label id="destinationField">To account<select name="destination_account_id"><option value="">Choose account</option>{% for a in active_accounts %}<option value="{{ a.id }}" {{ 'selected' if values.get('destination_account_id') == a.id|string }}>{{ a.name }}{{ ' · Pay credit card' if a.account_type == 'credit' else '' }}{{ ' (archived)' if not a.is_active else '' }}</option>{% endfor %}</select></label>
<label>Date & time<input type="datetime-local" step="1" name="occurred_at" value="{{ values.get('occurred_at', '') }}" required></label>
<label class="span-2">Description<input name="description" maxlength="255" value="{{ values.get('description', '') }}" placeholder="What was this for?"></label>
